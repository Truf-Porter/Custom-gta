
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevor Philips 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101014;color:white;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#panel{position:fixed;z-index:2;top:16px;left:16px;padding:14px 18px;background:#202027;border:1px solid #444;border-radius:12px;max-width:calc(100% - 32px)}
#panel h2{margin:0 0 7px;font-size:19px}
#status{font-size:12px;color:#bbb;overflow-wrap:anywhere}
#controls{position:fixed;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
button{background:#292930;color:white;border:1px solid #555;border-radius:9px;padding:12px 16px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
<h2>Trevor Philips 3D</h2>
<div id="status">Starting 3D engine...</div>
</div>
<div id="controls">
<button id="spin">Pause Spin</button>
<button id="reset">Reset Camera</button>
</div>
<canvas id="scene"></canvas>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const status = document.getElementById("status");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101014);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 1.3, 4);

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("scene"),
    antialias: true
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(4, 8, 5);
scene.add(light);

const fill = new THREE.DirectionalLight(0x8899ff, 2);
fill.position.set(-5, 3, -5);
scene.add(fill);

const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5, 64),
    new THREE.MeshStandardMaterial({color: 0x22222a, roughness: 0.9})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
scene.add(floor);

const character = new THREE.Group();
scene.add(character);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.1, 0);
controls.minDistance = 0.5;
controls.maxDistance = 12;

let spinning = true;
let modelReady = false;
let mixer = null;

const loader = new GLTFLoader();
const modelURL = new URL("./assets/trevor_phillips.glb", document.baseURI).href;

status.textContent = "Loading Trevor...";

loader.load(
    modelURL,
    (gltf) => {
        try {
            const model = gltf.scene;
            model.updateMatrixWorld(true);

            const bounds = new THREE.Box3().setFromObject(model);
            if (bounds.isEmpty()) {
                throw new Error("The model contains no visible objects.");
            }

            const center = bounds.getCenter(new THREE.Vector3());
            model.position.sub(center);
            model.updateMatrixWorld(true);

            const size = new THREE.Box3()
                .setFromObject(model)
                .getSize(new THREE.Vector3());

            const largest = Math.max(size.x, size.y, size.z);
            if (!Number.isFinite(largest) || largest <= 0) {
                throw new Error("Invalid model dimensions.");
            }

            model.scale.setScalar(2.2 / largest);

            model.traverse((object) => {
                if (object.isMesh) {
                    object.frustumCulled = false;
                    object.visible = true;
                    object.castShadow = true;
                    const materials = Array.isArray(object.material)
                        ? object.material
                        : [object.material];
                    materials.forEach((material) => {
                        if (material) material.side = THREE.DoubleSide;
                    });
                }
            });

            character.add(model);
            character.position.y = 1.1;

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }

            camera.position.set(0, 1.4, 4);
            controls.target.set(0, 1.1, 0);
            controls.update();

            modelReady = true;
            status.textContent = "Trevor loaded! Drag to rotate the view.";
        } catch (e) {
            status.textContent = "Model error: " + e.message;
        }
    },
    (event) => {
        if (event.total > 0) {
            status.textContent = "Loading: " +
                Math.round(event.loaded / event.total * 100) + "%";
        } else {
            status.textContent = "Downloading model...";
        }
    },
    (error) => {
        console.error("Model loading failed:", error);
        status.textContent = "Failed to load model. Check the file and network.";
    }
);

document.getElementById("spin").onclick = (event) => {
    spinning = !spinning;
    event.currentTarget.textContent = spinning ? "Pause Spin" : "Resume Spin";
};

document.getElementById("reset").onclick = () => {
    camera.position.set(0, 1.4, 4);
    controls.target.set(0, 1.1, 0);
    controls.update();
};

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);

    if (modelReady && spinning) {
        character.rotation.y += delta * 0.8;
    }

    if (mixer) mixer.update(delta);
    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
