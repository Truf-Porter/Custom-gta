
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trevor Philips 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101014;color:#fff;font-family:Arial,sans-serif}
canvas{display:block}
#panel{position:fixed;z-index:2;top:16px;left:16px;padding:14px 18px;background:#202027;border:1px solid #444;border-radius:12px;max-width:calc(100% - 32px)}
#panel h2{margin:0 0 7px;font-size:19px}
#status{font-size:12px;color:#bbb;overflow-wrap:anywhere}
#controls{position:fixed;z-index:2;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
button{background:#292930;color:white;border:1px solid #555;border-radius:9px;padding:12px 16px;white-space:nowrap}
</style>
</head>
<body>
<div id="panel">
<h2>Trevor Philips 3D</h2>
<div id="status">Initializing...</div>
</div>
<div id="controls">
<button id="spin">Pause Spin</button>
<button id="reset">Reset Camera</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const status = document.getElementById("status");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101014);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(0, 1.3, 4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(4, 8, 5);
scene.add(light);

const fill = new THREE.DirectionalLight(0x8899ff, 2);
fill.position.set(-5, 3, -5);
scene.add(fill);

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({color:0x202027, roughness:0.9})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

const character = new THREE.Group();
scene.add(character);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.minDistance = 0.5;
controls.maxDistance = 15;

let spinning = true;
let mixer = null;
let modelReady = false;

const loader = new GLTFLoader();
loader.setCrossOrigin("anonymous");

status.textContent = "Downloading Trevor model...";

loader.load(
    new URL("./assets/trevor_phillips.glb", location.href).href,
    (gltf) => {
        try {
            const model = gltf.scene;

            const initialBox = new THREE.Box3().setFromObject(model);
            if (initialBox.isEmpty()) {
                throw new Error("The GLB contains no visible 3D objects.");
            }

            const initialCenter = initialBox.getCenter(new THREE.Vector3());
            model.position.sub(initialCenter);

            const centeredBox = new THREE.Box3().setFromObject(model);
            const size = centeredBox.getSize(new THREE.Vector3());
            const maxDimension = Math.max(size.x, size.y, size.z);

            if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
                throw new Error("The model has invalid dimensions.");
            }

            model.scale.setScalar(2.2 / maxDimension);

            model.traverse((object) => {
                if (object.isMesh) {
                    object.frustumCulled = false;
                    object.castShadow = true;
                    object.visible = true;

                    const materials = Array.isArray(object.material)
                        ? object.material
                        : [object.material];

                    materials.forEach((material) => {
                        if (material) material.side = THREE.DoubleSide;
                    });
                }
            });

            character.add(model);
            character.position.y = 1.1;

            const box = new THREE.Box3().setFromObject(character);
            const finalCenter = box.getCenter(new THREE.Vector3());
            controls.target.copy(finalCenter);

            camera.position.set(0, finalCenter.y + 0.3, 4);
            controls.update();

            if (gltf.animations.length) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }

            modelReady = true;
            status.textContent = "Trevor loaded successfully!";
        } catch (e) {
            status.textContent = "Model error: " + e.message;
            console.error(e);
        }
    },
    (event) => {
        if (event.total > 0) {
            status.textContent = "Downloading model: " +
                Math.round(event.loaded / event.total * 100) + "%";
        } else {
            status.textContent = "Downloading model: " +
                (event.loaded / 1048576).toFixed(1) + " MB";
        }
    },
    (error) => {
        status.textContent = "Load failed. Check model format and network.";
        console.error("Trevor GLB loading error:", error);
    }
);

document.getElementById("spin").onclick = (event) => {
    spinning = !spinning;
    event.currentTarget.textContent = spinning ? "Pause Spin" : "Resume Spin";
};

document.getElementById("reset").onclick = () => {
    camera.position.set(0, 1.3, 4);
    controls.target.set(0, 1.1, 0);
    controls.update();
};

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);

    if (modelReady && spinning) {
        character.rotation.y += delta * 0.8;
    }

    if (mixer) mixer.update(delta);
    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
